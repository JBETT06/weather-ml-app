---
# (c) Deploy the DockerHub image to Kubernetes
# (d) Create a Service for the application
# (e) Scale the deployment (replicas + RollingUpdate strategy) for future rolling updates
- name: Deploy weather app to Minikube
  hosts: production
  become: true
  become_user: "{{ deploy_user }}"
  tasks:
    - name: Create manifest directory
      ansible.builtin.file:
        path: "/home/{{ deploy_user }}/k8s"
        state: directory
        mode: "0755"

    # The repo's k8s/*.yaml files are the single source of truth.
    - name: Copy Kubernetes manifests to the server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../k8s/{{ item }}"
        dest: "/home/{{ deploy_user }}/k8s/{{ item }}"
        mode: "0644"
      loop:
        - deployment.yaml
        - service.yaml

    - name: (c) Apply Deployment (pulls {{ docker_image }} from DockerHub)
      ansible.builtin.command: kubectl apply -f /home/{{ deploy_user }}/k8s/deployment.yaml
      register: deploy_out
      changed_when: "'created' in deploy_out.stdout or 'configured' in deploy_out.stdout"

    - name: (d) Apply Service
      ansible.builtin.command: kubectl apply -f /home/{{ deploy_user }}/k8s/service.yaml
      register: svc_out
      changed_when: "'created' in svc_out.stdout or 'configured' in svc_out.stdout"

    - name: (e) Read current replica count
      ansible.builtin.command: kubectl get deployment {{ app_name }} -o jsonpath={.spec.replicas}
      register: current_replicas
      changed_when: false

    - name: (e) Scale deployment if it differs from the desired replicas
      ansible.builtin.command: kubectl scale deployment/{{ app_name }} --replicas={{ replicas }}
      when: current_replicas.stdout | int != replicas | int

    - name: Wait for rollout to complete
      ansible.builtin.command: kubectl rollout status deployment/{{ app_name }} --timeout=240s
      changed_when: false

    - name: Show deployments, pods and services
      ansible.builtin.command: kubectl get deployments,pods,svc -o wide
      register: final
      changed_when: false

    - ansible.builtin.debug:
        var: final.stdout_lines
