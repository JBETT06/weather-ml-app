---
# (b) Install and start Minikube on the Production Server (and verify the cluster is running)
- name: Install and start Minikube
  hosts: production
  become: true
  gather_facts: true
  vars:
    # Minikube needs >= 2 vCPUs and ~1.8 GB RAM. On smaller servers (e.g. t2.micro)
    # we ask Minikube to skip those checks, but a 2 vCPU / 4 GB server is strongly recommended.
    low_resources: "{{ (ansible_processor_vcpus | int < 2) or (ansible_memtotal_mb | int < 1800) }}"
    minikube_start_args: >-
      --driver=docker --delete-on-failure
      {{ '--force --extra-config=kubeadm.ignore-preflight-errors=NumCPU,Mem' if low_resources | bool else '' }}
  tasks:
    - name: Warn if the server is below Minikube's recommended size
      ansible.builtin.debug:
        msg: >-
          Server has {{ ansible_processor_vcpus }} vCPU / {{ ansible_memtotal_mb }} MB RAM.
          Minikube wants 2 vCPU / ~2 GB; startup may fail or be unstable on this size.
      when: low_resources | bool

    - name: Install Docker and Minikube prerequisites
      ansible.builtin.apt:
        name: [docker.io, conntrack, curl]
        state: present
        update_cache: true

    - name: Ensure Docker is running and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Reset connection so docker group membership applies
      ansible.builtin.meta: reset_connection

    - name: Download Minikube binary
      ansible.builtin.get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: "0755"

    - name: Check whether the Minikube cluster is already running
      ansible.builtin.command: minikube status --format '{{ "{{.Host}}" }}'
      become_user: "{{ deploy_user }}"
      register: mk_status
      failed_when: false
      changed_when: false

    - name: Start Minikube (retry from a clean profile if the first attempt fails)
      when: "'Running' not in mk_status.stdout"
      block:
        - name: minikube start
          ansible.builtin.command: "minikube start {{ minikube_start_args }}"
          become_user: "{{ deploy_user }}"
          register: mk_start
      rescue:
        - name: First start failed - show why
          ansible.builtin.debug:
            msg: "{{ ansible_failed_result.stderr_lines | default([]) + ansible_failed_result.stdout_lines | default([]) }}"

        - name: Delete the broken Minikube profile
          ansible.builtin.command: minikube delete --all
          become_user: "{{ deploy_user }}"

        - name: minikube start (second attempt)
          ansible.builtin.command: "minikube start {{ minikube_start_args }}"
          become_user: "{{ deploy_user }}"

    - name: Get Minikube status
      ansible.builtin.command: minikube status
      become_user: "{{ deploy_user }}"
      register: mk_final
      changed_when: false

    - name: Assert the cluster is running
      ansible.builtin.assert:
        that:
          - "'host: Running' in mk_final.stdout"
          - "'kubelet: Running' in mk_final.stdout"
          - "'apiserver: Running' in mk_final.stdout"
        fail_msg: "Minikube is not running:\n{{ mk_final.stdout }}"
        success_msg: "Minikube is running"

    - name: Check kubectl can reach the cluster
      ansible.builtin.command: kubectl get nodes
      become_user: "{{ deploy_user }}"
      register: nodes
      changed_when: false

    - name: Show nodes
      ansible.builtin.debug:
        var: nodes.stdout_lines
