---
# (a) Install kubectl on the Production Server (and verify it)
- name: Install kubectl
  hosts: production
  become: true
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name: [curl, ca-certificates]
        state: present
        update_cache: true

    - name: Download kubectl binary
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Verify kubectl is installed
      ansible.builtin.command: kubectl version --client
      register: kubectl_out
      changed_when: false

    - name: Assert kubectl reports a client version
      ansible.builtin.assert:
        that: "'Client Version' in kubectl_out.stdout"
        fail_msg: "kubectl did not report a client version"
        success_msg: "kubectl installed: {{ kubectl_out.stdout_lines | first }}"
