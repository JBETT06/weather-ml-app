apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-ml
  labels:
    app: weather-ml
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: weather-ml
  template:
    metadata:
      labels:
        app: weather-ml
    spec:
      containers:
        - name: weather-ml
          image: jbett06/weather-ml-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
